{# kind: "trend" (đường) hoặc "criteria" (cột). src: endpoint JSON. #}
{% macro chart_card(title, src, kind, height=280, hint=None) %}
<section class="panel">
  <div class="panel-head">
    <h2 class="panel-title">{{ title }}</h2>
    {% if hint %}<span class="panel-hint">{{ hint }}</span>{% endif %}
  </div>
  <div class="chart-box" style="height: {{ height }}px">
    <canvas data-chart="{{ kind }}" data-src="{{ src }}" role="img" aria-label="{{ title }}"></canvas>
  </div>
</section>
{% endmacro %}
